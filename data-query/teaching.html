<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PASSION 教學資料查詢系統">
  <title>PASSION 教學資料查詢</title>
  <link rel="stylesheet" href="./styles.css?v=20261008-6">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./config.js?v=20261008-6"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">PASSION DATA</div>
      <h1>資料查詢</h1>
    </div>
    <div class="auth-actions">
      <button id="authorizeBtn" class="primary">使用 Google 帳號讀取資料</button>
      <button id="reloadBtn" class="secondary" disabled>重新讀取</button>
      <button id="signoutBtn" class="ghost" hidden>解除授權</button>
    </div>
  </header>

  <main>
    <nav class="data-tabs" aria-label="資料查詢分類">
      <a class="data-tab" href="./index.html">活動資料</a>
      <a class="data-tab active" href="./teaching.html" aria-current="page">教學資料</a>
      <span class="data-tab disabled" aria-disabled="true">問卷資料</span>
      <span class="data-tab disabled" aria-disabled="true">PASSION學程資料</span>
      <span class="data-tab disabled" aria-disabled="true">觀課資料</span>
    </nav>

    <section id="statusBox" class="status" data-kind="neutral">正在初始化…</section>

    <section id="teachingWorkspace" hidden>
      <div class="search-row">
        <label class="search-box">
          <span>自由搜尋</span>
          <input id="teachingKeyword" type="search" placeholder="例如：富北國中／英文／USR">
        </label>
        <label>
          <span>起始日期</span>
          <input id="teachingStartDate" type="date">
        </label>
        <label>
          <span>結束日期</span>
          <input id="teachingEndDate" type="date">
        </label>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <div class="filter-heading">
            <h2>篩選條件</h2>
            <button id="clearTeachingFiltersBtn" class="clear-filter-button" type="button">清除篩選</button>
          </div>
          <p class="muted">同一欄位多選＝OR；不同欄位＝AND。</p>

          <div class="teaching-rule">
            <strong>學期規則</strong>
            <span>08/01–01/15 上學期</span>
            <span>02/01–07/31 下學期</span>
            <span>01/16–01/31 暫不歸學期</span>
          </div>

          <div id="teachingFilters"></div>

          <hr>
          <label>
            <span>群組方式</span>
            <select id="teachingGroupSelect">
              <option value="school">依學校</option>
              <option value="time">依時間</option>
              <option value="project">依計畫</option>
              <option value="subject">依科目</option>
              <option value="region">依地區</option>
            </select>
          </label>
        </aside>

        <section class="content">
          <p id="teachingActiveFilters" class="active-filters"></p>
          <div id="teachingDateWarning" class="inline-warning" hidden></div>

          <div class="metric-grid three">
            <article class="metric-card">
              <span>診斷人次</span>
              <strong id="metricDiagnostic">0</strong>
            </article>
            <article class="metric-card">
              <span>扎根班</span>
              <strong id="metricRootClasses">0</strong>
            </article>
            <article class="metric-card">
              <span>扎根人次</span>
              <strong id="metricRootPeople">0</strong>
            </article>
          </div>

          <article class="panel">
            <div class="panel-head">
              <div>
                <h2 id="teachingSummaryTitle">教學成果｜依學校</h2>
                <p class="muted">三項核心指標依目前條件同步重算。</p>
              </div>
            </div>
            <div class="table-wrap compact">
              <table id="teachingSummaryTable">
                <thead>
                  <tr>
                    <th>群組</th>
                    <th>診斷人次</th>
                    <th>扎根班</th>
                    <th>扎根人次</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </article>

          <article class="panel">
            <div class="panel-head">
              <div>
                <h2>教學資料明細</h2>
                <p id="teachingDetailCount" class="muted"></p>
              </div>
              <button id="downloadTeachingBtn" class="secondary">下載篩選結果 CSV</button>
            </div>
            <div class="table-wrap">
              <table id="teachingDetailTable">
                <thead>
                  <tr>
                    <th>日期／期間</th>
                    <th>學年度</th>
                    <th>學期</th>
                    <th>計畫項目</th>
                    <th>地區</th>
                    <th>學校</th>
                    <th>學制</th>
                    <th>科目</th>
                    <th>診斷項目</th>
                    <th>年級</th>
                    <th>診斷人次</th>
                    <th>扎根班</th>
                    <th>扎根人次</th>
                    <th>資料來源</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="pager">
              <button id="teachingPrevPage" class="ghost">上一頁</button>
              <span id="teachingPageInfo"></span>
              <button id="teachingNextPage" class="ghost">下一頁</button>
            </div>
          </article>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="./js/teaching.js?v=20261008-6"></script>
</body>
</html>
