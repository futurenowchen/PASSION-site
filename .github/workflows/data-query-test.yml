name: PASSION data-query tests
on:
  push:
    branches: [main]
    paths:
      - "data-query/**"
      - ".github/workflows/data-query-test.yml"
  pull_request:
    paths:
      - "data-query/**"
      - ".github/workflows/data-query-test.yml"

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test data-query/tests/*.test.mjs
