name: Sync and optimize homepage photo pool
on:
  push:
    branches: [main]
    paths:
      - 'images/hero/**'
      - 'scripts/sync-hero-pool.cjs'
      - 'scripts/optimize-hero.cjs'
      - '.github/workflows/sync-home-hero.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-hero-folder
  cancel-in-progress: false
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Sharp image converter
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Synchronize original photo pool
        run: node scripts/sync-hero-pool.cjs
      - name: Generate AVIF, WebP and JPEG at 900/1600px
        run: node scripts/optimize-hero.cjs
      - name: Check image integrity and responsive outputs
        run: node --test tests/hero-photo-pool.test.cjs tests/hero-playback.test.cjs tests/hero-optimization.test.cjs
      - name: Commit web-sized sources and derived photos
        run: |
          git add data/hero.json data/hero-optimized.json images/hero/ images/hero-optimized/
          if git diff --cached --quiet; then
            echo "Optimized assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(hero): publish web-sized sources and responsive derivatives"
          git push
